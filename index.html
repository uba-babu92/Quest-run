const swapPrice = () => S.week && S.week.freeSwap ? SWAP_COST : 0;
function swapQuest(i) {
  const q = S.week.quests[i], p = placeById(q.pid); if (!p) return;
  const price = swapPrice();
  if (price > (S.coins || 0)) { toast(`Il te faut ${price} 🪙 pour changer (tu en as ${S.coins || 0})`); return; }
  const exclude = new Set(S.week.quests.map(x => x.pid));
  const pool = pickQuests(8, 'choix|' + q.pid + '|' + Date.now(), exclude, { km: q.km });
  const same = pool.filter(x => x.rarity === p.rarity), other = pool.filter(x => x.rarity !== p.rarity);

  const sh = sheet(`<h3>Changer de mission</h3>
    <p class="muted">${price ? `Ça coûte <b>${price} 🪙</b> (tu en as ${S.coins || 0}).` : 'Ton changement <b>gratuit</b> de la semaine.'} Choisis ta nouvelle quête :</p>

/* ---------- moments arcade ---------- */
let confettiRun = 0;
function confetti(colors) {
  const cv = $('#confetti'), cx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const run = ++confettiRun;
  const parts = Array.from({ length: 170 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .2, y: H * .38, vx: (Math.random() - .5) * 26 * devicePixelRatio,
    vy: (-Math.random() * 22 - 8) * devicePixelRatio, s: (5 + Math.random() * 7) * devicePixelRatio,
    c: colors[Math.random() * colors.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4
  }));
  const t0 = performance.now();
  (function step(t) {
    if (run !== confettiRun) return;
    cx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += .6 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
    }
    if (t - t0 < 4200) requestAnimationFrame(step); else cx.clearRect(0, 0, W, H);
  })(t0);
}
function countUp(el, to, ms = 900) {
  const t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / ms); el.textContent = '+' + fmt(Math.round(to * (1 - Math.pow(1 - k, 3)))) + ' ★'; if (k < 1) requestAnimationFrame(f); })(t0);
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function overlay(html, scroll) {
  const v = $('#victory'); $('#vin').innerHTML = html; v.classList.remove('hidden'); v.classList.toggle('scroll', !!scroll); v.scrollTop = 0;
  return new Promise(res => {
    const done = () => { v.classList.add('hidden'); confettiRun++; res(); };
    $('#vin').querySelector('[data-close]').onclick = done;
    $('#vin').addEventListener('closed', res, { once: true });
  });
}

const TIER_COL = { common: ['#D9DDE4', '#9AA1AE', '#E9ECF1'], rare: ['#B07BFF', '#5A12D6', '#C9A6FF'], epic: ['#8EC5FF', '#1559C9', '#BFE0FF'], legend: ['#FFE27A', '#D38E00', '#FFF3B0'], mythic: ['#FF5FD2', '#5F9DFF', '#FFD23F'] };
const loadImg = (src, cors) => new Promise((res, rej) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
function rrect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function wrapLines(x, text, w, max) {
  const out = []; let line = '';
  for (const word of text.split(/\s+/)) {
    const t = line ? line + ' ' + word : word;
    if (x.measureText(t).width > w && line) { out.push(line); line = word; if (out.length === max) break; } else line = t;
  }
  if (out.length < max && line) out.push(line);
  if (out.length === max && text.length > out.join(' ').length + 1) out[max - 1] = out[max - 1].replace(/[\s,;.]*\S*$/, '') + '…';
  return out;
}
function storyOf(c) {

}

/* --- itinéraire à pied (OpenStreetMap, sans clé) --- */
const ROUTER = p => `https://routing.openstreetmap.de/${p}/route/v1/driving/`;
// BRouter : profil randonnée (préfère sentiers, parcs, chemins balisés), trekking à vélo
const BROUTER_PROF = { 'routed-foot': 'hiking-mountain', 'routed-bike': 'trekking' };
async function brouter(points, prof, alt = 0) {
  const ll = points.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join('|');
  const j = await getJSON(`https://brouter.de/brouter?lonlats=${ll}&profile=${BROUTER_PROF[prof] || 'hiking-mountain'}&alternativeidx=${alt}&format=geojson`, 15000);
  const f = j.features && j.features[0]; if (!f || !f.geometry) throw new Error('brouter');
  const c = f.geometry.coordinates;
  return { pts: c.map(x => [x[1], x[0]]), ele: c.map(x => x[2]), dist: +f.properties['track-length'] || 0, engine: 'BRouter' };
}
async function routeVia(points, prof = 'routed-foot') {
  try {
    const tries = [brouter(points, prof, 0)];
    if (points.length === 2) tries.push(brouter(points, prof, 1));
    const ok = (await Promise.allSettled(tries)).filter(x => x.status === 'fulfilled').map(x => x.value);
    if (ok.length) return ok;
  } catch (e) {}
  return osrmVia(points, prof);
}

function routeSvg(pts) {

  return `<svg class="route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="#FFD23F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="5" fill="#9B5CFF"/><circle cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="5" fill="#fff"/></svg>`;
}

      else { const f = left / d; cur = { lat: cur.lat + (tg.lat - cur.lat) * f, lng: cur.lng + (tg.lng - cur.lng) * f }; left = 0; }

async function sha256(t) {

/* ---------- notifications perso (28/10) : 1 par jour max, à ton heure habituelle ---------- */
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
function notifHour() {
  const n = S.notif || {};
  if (n.hour && n.hour !== 'auto') return +n.hour;
  const hs = (S.runs || []).slice(-10).map(r => new Date(r.date).getHours()).sort((a, b) => a - b);
  return hs.length ? Math.max(7, Math.min(21, hs[Math.floor(hs.length / 2)])) : 18;
}
function notifPlan() {
  const H = notifHour(), out = [], now = Date.now(), m = monthlyNow(), fire = streakNow();
  for (let k = 0; k < 8; k++) {
    const d = new Date(); d.setDate(d.getDate() + k); d.setHours(H, 0, 0, 0);
    if (d.getTime() <= now + 60e3) continue;
    const wd = (d.getDay() + 6) % 7, key = dayKey(d);
    const tail = fire ? ` 🔥 Série de ${fire}` : '';
    let msg = null;
    const myth = mythWindows().find(w => d.getTime() >= w.a && d.getTime() < w.b && !(S.mythSeen || {})[w.key]);
    if (myth) msg = ['🌈 Apparition mythique !', `« ${myth.name} » n'apparaît que 4 fois par an… Le vieux sage t'attend !`];
    else if (S.goal.days.includes(wd) && !(S.streak && S.streak.last === key)) {
      const q = S.week && weekId(d) === S.week.id && S.week.quests.find(x => x.status === 'todo' && x.day === wd && !x.friend && !x.legend);
      const pl = q && placeById(q.pid);
      msg = ['🏃 Ta quête du jour', pl ? `${questLine(pl)[0]} · ${roundTripKm(pl).toFixed(1).replace('.', ',')} km${tail}` : `Hé, toi ! Le vieux sage a une mission pour toi aujourd'hui.${tail}`];
    }
    else if (wd === 0) msg = ['🗺️ Nouvelles quêtes !', "Le vieux sage a de nouvelles missions pour toi… et ton bilan de la semaine t'attend."];
    else if (wd === 5 && (prog().okRuns || 0) >= 6) msg = ['✨ Une rumeur court…', "On dit qu'une carte légendaire pourrait apparaître ce week-end. Garde l'œil ouvert !"];
    if (!msg && !m.done && m.key === d.getFullYear() + '-' + (d.getMonth() + 1) && Math.round((new Date(d.getFullYear(), d.getMonth() + 1, 1) - d) / 864e5) === 3) {
      const left = Math.max(1, m.target - monthlyProgress(m));
      msg = ['🏅 Défi du mois', `Plus que ${left} pour le badge de ${MONTH_NAMES[d.getMonth()]} !`];
    }
    if (msg) out.push({ t: d.getTime(), title: msg[0], body: msg[1] });
  }
  return out;
}
const pushPost = (path, body) => fetch(STORY_API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
let pushT = null;
function pushSync() {
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    if (!S.notif || !S.notif.on || !('serviceWorker' in navigator) || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) await pushPost('/push/plan', { sub: sub.toJSON(), plan: notifPlan() }); } catch (e) {}
  }, 1500);
}
async function enablePush() {
  if (isIOS() && !isStandalone()) {
    sheet(`<h3>Installe l'appli d'abord</h3><p class="muted">Sur iPhone, les notifications ne marchent que depuis l'appli installée :</p>
      <p>1. Touche <b>Partager</b> (le carré avec la flèche) en bas de Safari<br>2. Choisis <b>« Sur l'écran d'accueil »</b><br>3. Ouvre Quest Run depuis ton écran d'accueil et reviens ici.</p>
      <div class="row"><button class="btn" id="okinst">Compris</button></div>`).querySelector('#okinst').onclick = closeSheet;
    return false;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined') { toast('Ton téléphone ne gère pas les notifications web'); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications refusées : tu peux les autoriser dans Réglages → Quest Run'); return false; }
  try {
    const kj = await fetch(STORY_API + '/push/key').then(r => r.json());
    if (!kj.key) throw new Error(kj.error || 'relais pas prêt');
    const raw = Uint8Array.from(atob(kj.key.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((kj.key.length + 3) % 4)), c => c.charCodeAt(0));
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
    const r = await pushPost('/push/plan', { sub: sub.toJSON(), plan: notifPlan() });
    if (!r.ok) throw new Error(r.error || 'erreur');
    S.notif = Object.assign(S.notif || {}, { on: true }); save();
    pushPost('/push/test', { sub: sub.toJSON() }).catch(() => {});
    track('notif_on', {});
    toast('Notifications activées 🔔');
    return true;
  } catch (e) { toast('Notifications pas encore prêtes : ' + (e.message || e)); return false; }
}
async function disablePush() {
  S.notif = Object.assign(S.notif || {}, { on: false }); save();
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) { await pushPost('/push/off', { sub: sub.toJSON() }); await sub.unsubscribe(); } } catch (e) {}
  toast('Notifications coupées');
}

/* =====================================================================
   MÉTRIQUES — module autonome, sans dépendance, stocké sur l'appareil.
   Pour le retirer : supprimer ce bloc ET les lignes « track(...) »
   (ou garder juste : function track() {} ).
   Clé : "questrun_metrics". Rien n'est envoyé sur internet.
   ===================================================================== */
const Metrics = (() => {
  const KEY = 'questrun_metrics';
  // structure complète des données : rien d'autre n'est enregistré
  const empty = () => ({ consent: false, first_seen: null, last_seen: null, sessions: 0, session_durations: [], runs: 0,
    deaths_by_level: {}, levels_completed: 0, day1_returns: 0, days_active: [], onboarding_answers: {} });
  let m = empty();
  let segStart = null;   // début du morceau de session en cours (appli visible)
  let idx = -1;          // case de la session en cours dans session_durations

  // lecture / écriture protégées (Safari peut bloquer le stockage en navigation privée)
  function load() { try { const raw = localStorage.getItem(KEY); m = Object.assign(empty(), raw ? JSON.parse(raw) : {}); } catch (e) { m = empty(); } }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} }
  // jour local au format AAAA-MM-JJ
  const dayOf = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const yesterdayOf = t => { const d = new Date(t); d.setDate(d.getDate() - 1); return dayOf(d); };

  // ajoute le temps écoulé depuis segStart à la session en cours
  function flush() {
    if (segStart == null || idx < 0) return;
    const add = Math.round((Date.now() - segStart) / 1000);
    m.session_durations[idx] = (m.session_durations[idx] || 0) + Math.max(0, add);
    segStart = null;
    persist();
  }

  // ouverture de l'appli : compte la session, le retour J1 et le jour actif
  function startSession() {
    if (!m.consent) return;
    const now = Date.now(), today = dayOf(now);
    if (!m.first_seen) m.first_seen = new Date(now).toISOString();
    if (m.last_seen) {
      const last = dayOf(m.last_seen);
      if (last !== today && last === yesterdayOf(now)) m.day1_returns++;
    }
    if (!m.days_active.includes(today)) m.days_active.push(today);
    m.last_seen = new Date(now).toISOString();
    m.sessions++;
    idx = m.session_durations.push(0) - 1;
    segStart = now;
    persist();
  }

  // fonction centrale : un nom d'événement + des données
  function track(name, data = {}) {
    if (!m.consent) return;
    switch (name) {
      case 'session_start': startSession(); break;
      case 'session_end': flush(); break;
      case 'session_resume': if (segStart == null && idx >= 0) segStart = Date.now(); break;
      case 'run_start': m.runs++; persist(); break;
      case 'quiz': m.onboarding_answers[data.id] = data.value; persist(); break;
      case 'death': { const k = 'niveau_' + (data.level || 1); m.deaths_by_level[k] = (m.deaths_by_level[k] || 0) + 1; persist(); break; }
      case 'level_complete': m.levels_completed = Math.max(m.levels_completed, data.level || 1); persist(); break;
      default: break; // événement inconnu : ignoré (facile à étendre ici)
    }
  }

  // chiffres pour l'écran de stats (mode développeur)
  function summary() {
    flush(); if (idx >= 0 && document.visibilityState === 'visible') segStart = Date.now();
    const d = m.session_durations.filter(x => x > 0);
    const avg = d.length ? Math.round(d.reduce((a, b) => a + b, 0) / d.length) : 0;
    // jours qui avaient un lendemain possible (tous sauf aujourd'hui)
    const today = dayOf(Date.now()), base = m.days_active.filter(x => x !== today).length;
    let worst = null; for (const [k, v] of Object.entries(m.deaths_by_level)) if (!worst || v > worst[1]) worst = [k, v];
    return { sessions: m.sessions, j1: m.day1_returns, j1base: base, j1rate: base ? Math.round(m.day1_returns / base * 100) : null,
      avg, runs: m.runs, worst, days: m.days_active.length, best: m.levels_completed, first: m.first_seen };
  }

  // téléchargement (ou partage sur iPhone) du fichier JSON
  async function exportJSON() {
    flush(); if (idx >= 0) segStart = Date.now();
    const name = `questrun-metrics-${dayOf(Date.now())}.json`;
    const blob = new Blob([JSON.stringify(m, null, 2)], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Quest Run — métriques' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // message d'information, une seule fois
  function askConsent() {
    if (m.consent) return;
    const b = document.createElement('div'); b.className = 'backdrop'; b.style.zIndex = 1600;
    b.innerHTML = `<div class="sheet"><div class="grab"></div><h3>📊 Petite info</h3>
      <p class="muted">Ce jeu enregistre anonymement tes parties sur ton appareil pour améliorer le jeu. Aucune donnée personnelle n'est collectée.</p>
      <div class="row"><button class="btn" id="mok">OK</button></div></div>`;
    document.body.appendChild(b);
    b.querySelector('#mok').onclick = () => { m.consent = true; if (S.quiz) m.onboarding_answers = Object.assign({}, S.quiz); persist(); b.remove(); startSession(); };
  }

  // appli en arrière-plan / au premier plan, et fermeture (iOS : pagehide)
  document.addEventListener('visibilitychange', () => track(document.visibilityState === 'hidden' ? 'session_end' : 'session_resume'));
  window.addEventListener('pagehide', () => track('session_end'));

  load();
  return { track, summary, exportJSON, askConsent, get consent() { return m.consent; } };
})();
function track(name, data) { Metrics.track(name, data); }

// appui long de 3 s sur le logo de l'écran Quêtes : export du fichier (sans afficher les stats)
(() => {
  const logo = document.querySelector('#s-quests .logo'); if (!logo) return;
  logo.style.userSelect = 'none'; logo.style.webkitUserSelect = 'none'; logo.style.webkitTouchCallout = 'none';
  let t = null;
  const stop = () => { clearTimeout(t); t = null; };
  logo.addEventListener('pointerdown', () => { stop(); t = setTimeout(() => { t = null; vibrate(40); Metrics.exportJSON(); }, 3000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => logo.addEventListener(e, stop));
})();
/* ========================= fin du bloc MÉTRIQUES ========================= */

/* ---------- démarrage ---------- */
applyTheme();
readFriendLink();
if (typeof L === 'undefined') {
  document.body.innerHTML = '<div class="empty" style="margin-top:40vh">Pas de connexion : la carte ne peut pas se charger.<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>';
} else if (!S.onboarded || !S.home) {
  onboarding(0);
} else {
  ensureWeek(); fixDays(); initProgress(); comeback(); pushSync();
  tab('quests');
  setTimeout(async () => { await dailyGift(); await weeklyRecap(); await checkMonthly(); if (S.pendingFriend) await addFriendQuest(); else await maybeLegend(); }, 1200);
  upgradePlaces().catch(() => {});
  checkStreakBreak();
  loadElevations().then(() => current === 'quests' && renderQuests()).catch(() => {});
  track('session_start'); Metrics.askConsent();
  try { const r = JSON.parse(localStorage.getItem(RUN_KEY)); if (r && Date.now() - r.start < 6 * 3600e3) { RUN = r; openRun(); toast('Course reprise'); } else localStorage.removeItem(RUN_KEY); } catch (e) {}
  // précharge les images des quêtes de la semaine
  S.week && S.week.quests.forEach(q => q.status !== 'done' && wikiFor(placeById(q.pid)));
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
