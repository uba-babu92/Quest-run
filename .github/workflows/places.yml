name: Robot des lieux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/areas.json', 'tools/build-places.mjs', 'tools/enrich-places.mjs', '.github/workflows/places.yml']
  schedule:
    - cron: '17 3 * * 1'   # chaque lundi à 3 h 17 (UTC)

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les lieux
        run: |
          git config user.name "Robot des lieux"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/build-places.mjs
      - name: Vérifier les histoires (Wikipédia, Wikidata)
        run: node tools/enrich-places.mjs
      - name: Enregistrer
        run: |
          git config user.name "Robot des lieux"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Lieux mis à jour"
          git pull --rebase origin main
          git push origin HEAD:main
