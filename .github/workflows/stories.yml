name: Robot des histoires

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build-stories.mjs', '.github/workflows/stories.yml']

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: true

jobs:
  build:
    # Arrêté le 27/10 à la demande de Bazil : les textes seront écrits à la demande, carte par carte.
    # Lancement manuel seulement (onglet Actions → Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Écrire les histoires avec Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          git config user.name "Robot des histoires"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/build-stories.mjs
