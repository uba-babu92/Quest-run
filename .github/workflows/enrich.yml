name: Robot des histoires vérifiables

# Note les lieux déjà téléchargés (Wikipédia, Wikidata), sans retélécharger OpenStreetMap.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/enrich-places.mjs', '.github/workflows/enrich.yml']

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les histoires (Wikipédia, Wikidata)
        run: node tools/enrich-places.mjs
      - name: Enregistrer
        run: |
          git config user.name "Robot des lieux"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Lieux : histoires vérifiées"
          git pull --rebase origin main
          git push origin HEAD:main
